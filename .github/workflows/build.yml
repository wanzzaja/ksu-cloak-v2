name: Build KSU-Cloak v2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b

      - name: Configure
        run: |
          cd zygisk
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build zygisk/build -j$(nproc)

      - name: Stage
        run: |
          mkdir -p stage/zygisk
          cp module.prop customize.sh stage/
          cp zygisk/build/arm64-v8a.so stage/zygisk/arm64-v8a.so

      - name: Zip
        run: cd stage && zip -r ../ksu-cloak-v2.0.0.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ksu-cloak-v2-module
          path: ksu-cloak-v2.0.0.zip
          retention-days: 30
